version: 2

project_name: room

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.builtinSentryDSN={{ envOrDefault "SENTRY_DSN" "" }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - repository:
      owner: amzyang
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://github.com/amzyang/room
    description: Meeting room booking automation CLI for Feishu (Lark)
    install: |
      bin.install "room"
      generate_completions_from_executable(bin/"room", "completion")
    # brew services start room：launchd 每 2 天跑一次 keepalive，
    # 滚动约 7 天的 refresh 窗口，防止低频使用掉登录态。
    service: |
      run [opt_bin/"room", "keepalive"]
      run_type :interval
      interval 172800
      log_path var/"log/room-keepalive.log"
      error_log_path var/"log/room-keepalive.log"
    test: |
      system "#{bin}/room --version"
